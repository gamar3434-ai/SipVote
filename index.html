<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>برنامج المواهب - 4 متسابقين</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif}
body{background:#0a0014;overflow-x:hidden;color:#fff}
.stage{position:fixed;inset:0;background:radial-gradient(ellipse at center,#2d0a4e 0%,#0a0014 70%);z-index:-2}
.spotlight{position:absolute;width:600px;height:600px;background:radial-gradient(circle,rgba(255,215,0,0.15) 0%,transparent 70%);border-radius:50%;animation:move 8s infinite ease-in-out;z-index:-1}
.spotlight:nth-child(2){animation-delay:4s;left:60%;top:20%}
@keyframes move{0%,100%{transform:translate(0,0)}50%{transform:translate(100px,50px)}}
header{text-align:center;padding:40px 20px 20px}
.title{font-size:48px;font-weight:900;background:linear-gradient(90deg,#ffd700,#ff6b00,#ff0080,#ffd700);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shine 3s linear infinite}
@keyframes shine{to{background-position:200% center}}
.subtitle{color:#b89fff;margin-top:8px;font-size:18px}
.container{max-width:1300px;margin:0 auto;padding:20px}
.contestants{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;margin-top:40px}
.card{background:linear-gradient(135deg,#1a0b2e 0%,#2d0a4e 100%);border:2px solid #6b2fa3;border-radius:24px;overflow:hidden;position:relative;box-shadow:0 0 40px rgba(107,47,163,0.4);transition:.3s}
.card:hover{transform:translateY(-10px) scale(1.02);box-shadow:0 0 60px rgba(255,215,0,0.5);border-color:#ffd700}
.card::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(45deg,transparent,#ffd700,transparent);animation:border-glow 3s linear infinite}
@keyframes border-glow{to{transform:rotate(360deg)}}
.card-inner{background:#1a0b2e;margin:3px;border-radius:21px;position:relative;z-index:1}
.img-wrap{position:relative;height:320px;overflow:hidden}
.img-wrap img{width:100%;height:100%;object-fit:cover}
.rank{position:absolute;top:12px;right:12px;background:linear-gradient(135deg,#ffd700,#ff6b00);color:#000;width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;box-shadow:0 0 20px #ffd700}
.info{padding:20px;text-align:center}
.name{font-size:26px;font-weight:900;margin-bottom:8px;color:#ffd700}
.talent{color:#b89fff;font-size:16px;margin-bottom:16px}
.votes{background:#0a0014;border:2px solid #6b2fa3;border-radius:16px;padding:12px;margin-bottom:16px}
.votes-num{font-size:32px;font-weight:900;color:#ffd700}
.votes-label{font-size:14px;color:#b89fff}
.vote-btn{width:100%;background:linear-gradient(135deg,#ffd700,#ff6b00);color:#000;border:none;padding:16px;border-radius:16px;font-size:18px;font-weight:900;cursor:pointer;transition:.2s}
.vote-btn:hover{transform:scale(1.05);box-shadow:0 0 30px #ffd700}
.vote-btn:active{transform:scale(0.98)}
.vote-btn:disabled{background:#444;color:#888;cursor:not-allowed}
.user-bar{position:fixed;top:20px;left:20px;z-index:100;display:flex;gap:12px}
.btn{background:rgba(107,47,163,0.6);backdrop-filter:blur(10px);border:1px solid #6b2fa3;color:#fff;padding:10px 20px;border-radius:12px;cursor:pointer;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal.show{display:flex}
.modal-box{background:linear-gradient(135deg,#1a0b2e,#2d0a4e);border:2px solid #ffd700;border-radius:24px;padding:30px;max-width:450px;width:100%}
.modal-box h2{color:#ffd700;margin-bottom:20px;text-align:center}
.input{width:100%;background:#0a0014;border:2px solid #6b2fa3;color:#fff;padding:14px;border-radius:12px;margin:10px 0;font-size:16px}
.input:focus{outline:none;border-color:#ffd700}
.btn-primary{width:100%;background:linear-gradient(135deg,#ffd700,#ff6b00);color:#000;border:none;padding:14px;border-radius:12px;font-size:18px;font-weight:900;cursor:pointer;margin-top:10px}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.admin-card{background:#0a0014;border:1px solid #6b2fa3;padding:12px;border-radius:12px}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#ffd700,#ff6b00);color:#000;padding:16px 32px;border-radius:16px;font-weight:900;display:none;z-index:300}
.toast.show{display:block;animation:toast-in .4s}
@keyframes toast-in{from{transform:translate(-50%,100px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.live-badge{position:fixed;top:20px;right:20px;background:#ff0080;padding:8px 16px;border-radius:20px;font-weight:900;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,0,128,0.7)}50%{box-shadow:0 0 0 10px rgba(255,0,128,0)}}
</style>
</head>
<body>
<div class="stage"></div>
<div class="spotlight"></div>
<div class="spotlight"></div>
<div class="live-badge">🔴 بث مباشر</div>
<div class="user-bar">
  <button class="btn" id="loginBtn">تسجيل دخول</button>
  <button class="btn" id="adminBtn">لوحة التحكم</button>
</div>
<header>
  <h1 class="title">برنامج نجم الموسم</h1>
  <p class="subtitle">صوّت لموهبتك المفضلة وفوزها باللقب</p>
</header>
<div class="container">
  <div class="contestants" id="contestants"></div>
</div>
<div class="modal" id="loginModal">
  <div class="modal-box">
    <h2>انضم للجمهور</h2>
    <input class="input" id="userName" placeholder="الاسم الكامل">
    <input class="input" id="userEmail" placeholder="البريد الإلكتروني" type="email">
    <input class="input" id="userPhone" placeholder="رقم الجوال" type="tel">
    <button class="btn-primary" onclick="login()">دخول وتصويت</button>
  </div>
</div>
<div class="modal" id="adminModal">
  <div class="modal-box">
    <h2>لوحة تحكم البرنامج</h2>
    <div id="adminLogin">
      <input class="input" id="adminPass" type="password" placeholder="كلمة المرور: admin123">
      <button class="btn-primary" onclick="adminLogin()">دخول</button>
    </div>
    <div id="adminPanel" style="display:none">
      <div class="admin-grid" id="adminList"></div>
      <button class="btn-primary" onclick="resetAll()" style="background:#ff0080;color:#fff">تصفير كل الأصوات</button>
      <button class="btn" onclick="closeModal('adminModal')" style="width:100%;margin-top:10px">إغلاق</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const contestants=[
 {id:1,name:"ماجد السعيد",talent:"غناء شرقي",img:"https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=600",votes:0},
 {id:2,name:"لمى العبدالله",talent:"رقص استعراضي",img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=600",votes:0},
 {id:3,name:"ياسر الحربي",talent:"ستاند أب كوميدي",img:"https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=600",votes:0},
 {id:4,name:"شهد القحطاني",talent:"عزف بيانو",img:"https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=600",votes:0}
];
let data=JSON.parse(localStorage.getItem('show4')||'null');
if(data){contestants.splice(0,contestants.length,...data.contestants)}
let user=JSON.parse(localStorage.getItem('show4user')||'null');
let voted=JSON.parse(localStorage.getItem('show4voted')||'{}');
function save(){localStorage.setItem('show4',JSON.stringify({contestants}));localStorage.setItem('show4user',JSON.stringify(user));localStorage.setItem('show4voted',JSON.stringify(voted));}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
function render(){
 const sorted=[...contestants].sort((a,b)=>b.votes-a.votes);
 const wrap=document.getElementById('contestants');wrap.innerHTML='';
 sorted.forEach((c,i)=>{
   const rank=i+1;
   const medal=rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':'';
   wrap.innerHTML+=`
   <div class="card">
     <div class="card-inner">
       <div class="img-wrap">
         <img src="${c.img}" alt="${c.name}">
         <div class="rank">${medal||rank}</div>
       </div>
       <div class="info">
         <div class="name">${c.name}</div>
         <div class="talent">${c.talent}</div>
         <div class="votes">
           <div class="votes-num">${c.votes}</div>
           <div class="votes-label">صوت</div>
         </div>
         <button class="vote-btn" onclick="vote(${c.id})" ${voted[user?.email]?'disabled':''}>${voted[user?.email]?'تم التصويت':'صوّت الآن'}</button>
       </div>
     </div>
   </div>`;
 });
 document.getElementById('loginBtn').textContent=user?'مرحبا '+user.name:'تسجيل دخول';
}
function vote(id){
 if(!user){document.getElementById('loginModal').classList.add('show');return}
 if(voted[user.email]){toast('صوتت من قبل');return}
 voted[user.email]=id;
 contestants.find(c=>c.id===id).votes++;
 save();render();toast('شكرا لتصويتك');
}
function login(){
 const name=document.getElementById('userName').value.trim();
 const email=document.getElementById('userEmail').value.trim();
 const phone=document.getElementById('userPhone').value.trim();
 if(!name||!email||!phone){toast('أكمل البيانات');return}
 user={name,email,phone};save();closeModal('loginModal');render();toast('حياك '+name);
}
function adminLogin(){
 if(document.getElementById('adminPass').value==='admin123'){
   document.getElementById('adminLogin').style.display='none';
   document.getElementById('adminPanel').style.display='block';
   const list=document.getElementById('adminList');list.innerHTML='';
   contestants.forEach(c=>{
     list.innerHTML+=`<div class="admin-card"><div>${c.name}</div><div style="font-size:24px;color:#ffd700">${c.votes}</div></div>`;
   });
 }else toast('كلمة مرور خطأ');
}
function resetAll(){
 if(confirm('متأكد؟')){contestants.forEach(c=>c.votes=0);voted={};save();render();toast('تم التصفير')}
}
function closeModal(id){document.getElementById(id).classList.remove('show')}
document.getElementById('loginBtn').onclick=()=>{if(user){user=null;save();render();toast('تم الخروج')}else{document.getElementById('loginModal').classList.add('show')}}
document.getElementById('adminBtn').onclick=()=>document.getElementById('adminModal').classList.add('show');
render();
setInterval(render,3000);
</script>
</body>
</html>
</html>
